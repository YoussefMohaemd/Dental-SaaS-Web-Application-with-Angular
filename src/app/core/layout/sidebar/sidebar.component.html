<aside [class]="sidebarClasses()">
  <!-- Logo -->
  <div class="flex items-center gap-3 px-4 h-14 border-b border-white/10 shrink-0">
    <div class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center shrink-0">
      <span class="text-white text-xs font-bold font-display">DL</span>
    </div>
    @if (sidebarOpen()) {
      <span class="font-display font-semibold text-sm text-white tracking-wide whitespace-nowrap">
        DentaLab
      </span>
    }
  </div>

  <!-- Nav -->
  <nav class="flex-1 py-3 overflow-y-auto sidebar-scrollbar">
    @for (item of navItems; track item.id) {
      <button
        (click)="navigationService.navigate(item.id)"
        [class]="navItemClasses(item)"
      >
        @if (isItemActive(item)) {
          <span class="absolute left-0 top-1/2 -translate-y-1/2 w-0.5 h-5 bg-primary rounded-r-full"></span>
        }
        <span class="shrink-0" [innerHTML]="getIconSvg(item.icon)"></span>
        @if (sidebarOpen()) {
          <span class="truncate font-medium">{{ item.label }}</span>
        }
        @if (sidebarOpen() && item.badge) {
          <span class="ml-auto text-xs bg-primary/80 text-white px-1.5 py-0.5 rounded-full font-mono">
            {{ item.badge }}
          </span>
        }
      </button>
    }
  </nav>

  <!-- User -->
  <div class="border-t border-white/10 p-3 shrink-0">
    <div class="flex items-center gap-2.5">
      <app-avatar
        [name]="userName"
        [size]="'sm'"
        [variant]="'primary'"
      />
      @if (sidebarOpen()) {
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-white truncate">{{ userName }}</p>
          <p class="text-xs text-sidebar-muted truncate">{{ userRole }}</p>
        </div>
      }
    </div>
  </div>
</aside>
