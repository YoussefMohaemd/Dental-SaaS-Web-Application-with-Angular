<div class="bg-card border border-border rounded-xl p-4">
  <p
    class="text-xs font-semibold text-muted-foreground uppercase tracking-wide mb-3"
  >
    Order Summary
  </p>
  <dl class="space-y-2 text-xs">
    <div class="flex justify-between gap-2">
      <dt class="text-muted-foreground">Restoration</dt>
      <dd class="font-semibold text-foreground">{{ order().restoration }}</dd>
    </div>
    <div class="flex justify-between gap-2">
      <dt class="text-muted-foreground">Arch</dt>
      <dd class="font-semibold text-foreground">{{ order().arch }}</dd>
    </div>
    <div class="flex justify-between gap-2">
      <dt class="text-muted-foreground">Shade</dt>
      <dd class="font-mono text-foreground">{{ order().shade }}</dd>
    </div>
    <div class="flex justify-between gap-2">
      <dt class="text-muted-foreground">Units</dt>
      <dd class="font-mono text-foreground">{{ order().units }}</dd>
    </div>
    <div class="flex justify-between gap-2">
      <dt class="text-muted-foreground">Amount</dt>
      <dd class="font-mono font-semibold text-foreground">
        {{ order().amount | currency }}
      </dd>
    </div>
    <div class="flex justify-between gap-2">
      <dt class="text-muted-foreground">Bill to</dt>
      <dd class="max-w-32 truncate font-medium text-foreground">
        {{ order().billTo }}
      </dd>
    </div>
    <div class="flex justify-between gap-2">
      <dt class="text-muted-foreground">Scan center</dt>
      <dd class="max-w-32 truncate text-foreground">
        {{ order().scanCenterName }}
      </dd>
    </div>
  </dl>
</div>
