<button
  [type]="type()"
  [disabled]="isDisabled()"
  [class]="buttonClasses()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-disabled]="isDisabled() ? 'true' : null"
  (click)="handleClick($event)"
>
  @if (loading()) {
    <span class="loading-spinner" aria-hidden="true"></span>
  }
  <ng-content></ng-content>
</button>
