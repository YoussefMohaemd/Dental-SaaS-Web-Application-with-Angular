<div class="relative">
  <svg
    class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"
    width="13" height="13"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
  >
    <circle cx="11" cy="11" r="8" />
    <path d="M21 21l-4.35-4.35" />
  </svg>
  <input
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur.emit($event)"
    class="w-full pl-8 pr-10 py-1.5 text-xs bg-muted rounded-lg border border-border placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/30"
  />
  <button
    *ngIf="value() && clearable()"
    (click)="clear()"
    class="absolute right-2 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground"
  >
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 6L6 18M6 6l12 12" />
    </svg>
  </button>
  <kbd *ngIf="showShortcut()" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-muted-foreground hidden lg:block">
    ⌘K
  </kbd>
</div>
