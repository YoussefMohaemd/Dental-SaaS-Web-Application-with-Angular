<div class="search-input-wrap relative w-full">
  <app-input
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [ariaLabel]="ariaLabel()"
    [unstyled]="true"
    [inputClass]="inputClasses()"
    [iconStart]="true"
    [iconEnd]="showShortcut() || (!!value() && clearable())"
    (valueChange)="onValueChanged($event)"
    (onBlur)="onBlur.emit($event)"
  >
    <span
      slot="prefix"
      class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none shrink-0"
      aria-hidden="true"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="M21 21l-4.35-4.35" />
      </svg>
    </span>

    @if (value() && clearable()) {
      <span slot="suffix">
        <app-button
          variant="ghost"
          size="icon-sm"
          ariaLabel="Clear search"
          [buttonClass]="clearButtonClass()"
          (onClick)="clear()"
        >
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </app-button>
      </span>
    }

    @if (showShortcut()) {
      <kbd
        slot="suffix"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-muted-foreground hidden lg:block pointer-events-none"
      >
        ⌘K
      </kbd>
    }
  </app-input>
</div>
