<div class="flex flex-col items-center justify-center text-center" [style.height]="height()">
  <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mb-4">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-danger">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 8v4M12 16h.01" />
    </svg>
  </div>
  <h3 class="font-display font-semibold text-foreground mb-1">{{ title() }}</h3>
  <p class="text-sm text-muted-foreground mb-4">{{ description() }}</p>
  <app-button *ngIf="retryLabel()" variant="primary" size="sm" (onClick)="retryClick.emit()">
    {{ retryLabel() }}
  </app-button>
</div>
