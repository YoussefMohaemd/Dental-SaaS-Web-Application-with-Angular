<app-button
  variant="ghost"
  [size]="size()"
  [disabled]="disabled()"
  [ariaLabel]="ariaLabel()"
  [title]="title() || ariaLabel()"
  [ariaExpanded]="ariaExpanded()"
  [buttonClass]="mergedButtonClass()"
  (onClick)="onClick($event)"
>
  <span
    class="icon-action-svg"
    [innerHTML]="iconSvg() | safeHtml"
    aria-hidden="true"
  ></span>
</app-button>
