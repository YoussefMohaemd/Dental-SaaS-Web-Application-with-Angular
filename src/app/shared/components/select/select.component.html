<div class="space-y-1.5">
  @if (label()) {
    <label
      class="block text-xs font-semibold text-foreground"
      [for]="selectId()"
    >
      {{ label() }}
      @if (required()) {
        <span class="ml-0.5 text-danger">*</span>
      }
    </label>
  }

  <select
    class="w-full cursor-pointer appearance-none rounded-lg border border-border bg-card px-3 py-2 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30 disabled:cursor-not-allowed disabled:opacity-50"
    [id]="selectId()"
    [value]="value()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-label]="ariaLabel() || null"
    (change)="onChange($event)"
  >
    @if (placeholder()) {
      <option value="">{{ placeholder() }}</option>
    }
    @for (option of options(); track option) {
      <option [value]="option">{{ option }}</option>
    }
  </select>
</div>
