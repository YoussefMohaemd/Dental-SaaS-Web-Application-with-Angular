<div class="space-y-1.5" [ngClass]="wrapperClass()">
  @if (label()) {
    <label
      tuiLabel
      class="label-base"
      [ngClass]="labelClass()"
      [for]="selectId()"
    >
      {{ label() }}
      @if (required()) {
        <span class="ml-0.5 text-danger">*</span>
      }
    </label>
  }

  <select
    [class]="classes()"
    [id]="selectId()"
    [value]="value()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.aria-label]="ariaLabel() || (!label() && placeholder()) || null"
    (change)="onChange($event)"
    (blur)="onBlur()"
  >
    @if (placeholder()) {
      <option value="">{{ placeholder() }}</option>
    }
    @if (normalizedOptions().length > 0) {
      @for (option of normalizedOptions(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    } @else {
      <ng-content></ng-content>
    }
  </select>
</div>
