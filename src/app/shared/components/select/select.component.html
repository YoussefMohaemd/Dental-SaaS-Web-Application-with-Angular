<div class="relative">
  <label *ngIf="label()" [for]="id()" class="label-base">{{ label() }}</label>
  <select
    [id]="id()"
    [disabled]="disabled()"
    [required]="required()"
    [value]="value()"
    (change)="onChangeEvent($event)"
    (blur)="onBlur.emit($event)"
    [class]="selectClasses()"
    [attr.aria-describedby]="error() ? errorId() : hint() ? hintId() : null"
    [attr.aria-invalid]="!!error()"
  >
    <option *ngIf="placeholder()" value="" disabled>{{ placeholder() }}</option>
    <option *ngFor="let opt of options()" [value]="opt.value">{{ opt.label }}</option>
  </select>
  <div class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-muted-foreground">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M6 9l6 6 6-6" />
    </svg>
  </div>
  <p *ngIf="hint() && !error()" [id]="hintId()" class="field-hint">{{ hint() }}</p>
  <p *ngIf="error()" [id]="errorId()" class="field-error">{{ error() }}</p>
</div>
