<div *ngIf="isBoth()" class="flex gap-0.5">

    class="px-1 py-0.5 bg-blue-50 text-blue-700 rounded text-[9px] font-semibold"
    >MX</span
  >
  <span
    class="px-1 py-0.5 bg-teal-50 text-teal-700 rounded text-[9px] font-semibold"

  {{ archText() }}
</span>
