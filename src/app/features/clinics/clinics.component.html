<div class="flex flex-col h-full">
  <!-- Page header -->
  <div class="px-6 py-4 border-b border-border bg-card shrink-0">
    <div class="flex items-center gap-3">
      <div>
        <h1 class="font-display font-bold text-lg text-foreground">Clinics</h1>
        <p class="text-xs text-muted-foreground">{{ filtered().length }} partner clinics</p>
      </div>
      <div class="ml-auto flex items-center gap-3">
        <div class="relative">
          <span [innerHTML]="getIconSvg('search')" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"></span>
          <input
            class="pl-8 pr-4 py-1.5 text-xs bg-muted rounded-lg border border-border placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/30 w-56"
            placeholder="Search clinics..."
            [value]="search()"
            (input)="onSearchChange($event)"
          />
        </div>
        <app-button variant="primary" size="sm" class="flex items-center gap-2">
          <span [innerHTML]="getIconSvg('plus')"></span>
          Add Clinic
        </app-button>
      </div>
    </div>
  </div>

  <!-- Grid -->
  <div class="flex-1 overflow-auto p-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
      @for (c of filtered(); track c.id) {
        <button
          (click)="navigationService.navigate('clinicDetails', { clinicId: c.id })"
          class="bg-card border border-border rounded-xl p-5 text-left hover:border-primary/40 hover:shadow-sm transition-all group"
        >
          <div class="flex items-start justify-between mb-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center">
              <span [innerHTML]="getIconSvg('building-2')" class="text-emerald-600" style="width: 18px; height: 18px;"></span>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold" [class]="getStatusClass(c.status)">
              {{ c.status }}
            </span>
          </div>
          <h3 class="font-display font-semibold text-foreground mb-1">{{ c.name }}</h3>
          <p class="text-xs text-muted-foreground mb-3">{{ c.address }}, {{ c.city }}</p>
          <div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-border">
            @for (stat of [
              { label: 'Doctors', value: c.doctorsCount },
              { label: 'Patients', value: c.patientsCount },
              { label: 'Orders', value: c.ordersCount }
            ]; track stat.label) {
              <div class="text-center">
                <p class="font-display font-bold text-foreground text-lg">{{ stat.value }}</p>
                <p class="text-[10px] text-muted-foreground">{{ stat.label }}</p>
              </div>
            }
          </div>
          <div class="mt-3 pt-3 border-t border-border">
            <p class="text-xs text-muted-foreground">Manager: <span class="text-foreground font-medium">{{ c.accountManager }}</span></p>
          </div>
        </button>
      }
    </div>
  </div>
</div>
