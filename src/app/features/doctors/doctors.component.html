<div class="enterprise-table-page">
  <app-data-table-toolbar
    title="Doctors"
    [subtitle]="filtered().length + ' referring dentists'"
  ></app-data-table-toolbar>

  <app-search-filter-toolbar
    searchId="doctors-search"
    searchPlaceholder="Search doctors..."
    [searchValue]="search()"
    [searchIconSvg]="getIconSvg('search')"
    selectId="doctors-status-filter"
    selectPlaceholder="All Status"
    selectAriaLabel="Status"
    [selectOptions]="STATUS_OPTIONS"
    [selectValue]="statusFilter()"
    actionLabel="Add Doctor"
    actionAriaLabel="Add doctor"
    [actionIconSvg]="getIconSvg('plus')"
    (searchValueChange)="onSearchValueChange($event)"
    (selectValueChange)="onStatusFilterValueChange($event)"
    (actionClick)="openAddDialog()"
  ></app-search-filter-toolbar>

  <div class="enterprise-table-panel">
    <div class="enterprise-table-scroll">
      @if (loading()) {
        <app-table-feedback
          mode="loading"
          message="Loading doctors..."
          [iconSvg]="getIconSvg('loader')"
          [spin]="true"
          iconClass="text-muted-foreground mb-3"
          iconWidth="28px"
          iconHeight="28px"
        ></app-table-feedback>
      } @else if (filtered().length === 0) {
        <app-table-feedback
          mode="empty"
          message="No doctors found"
          [iconSvg]="getIconSvg('user-cog')"
          iconClass="text-muted-foreground mb-3"
          iconWidth="32px"
          iconHeight="32px"
        ></app-table-feedback>
      } @else {
        <p-table
          [value]="filtered()"
          [tableStyle]="{ 'min-width': '70rem' }"
          styleClass="p-datatable-sm enterprise-prime-table enterprise-data-table"
        >
          <ng-template pTemplate="header">
            <tr>
              @for (config of sortConfigs; track config.col) {
                <th
                  scope="col"
                  class="enterprise-th-sort"
                  [attr.aria-sort]="sortAriaSort(config.col)"
                >
                  <button
                    type="button"
                    class="enterprise-th-sort-btn"
                    (click)="toggleSort(config.col)"
                    [attr.aria-label]="sortAriaLabel(config.col, config.label)"
                  >
                    <span class="enterprise-th-label"
                      >{{ config.label }}
                      <span
                        aria-hidden="true"
                        [innerHTML]="getIconSvg('arrow-up-down') | safeHtml"
                        class="inline"
                        [class.text-primary]="sortCol() === config.col"
                        [class.text-muted-foreground/40]="
                          sortCol() !== config.col
                        "
                        style="width: 10px; height: 10px"
                      ></span>
                    </span>
                  </button>
                </th>
              }
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-d>
            <tr
              class="cursor-pointer"
              (click)="
                navigationService.navigate('doctorDetails', {
                  doctorId: d.id,
                })
              "
            >
              <td>
                <div class="flex min-w-0 items-center gap-3">
                  <app-avatar
                    class="doctor-avatar"
                    [name]="d.name"
                    [size]="'md'"
                    [variant]="'violet'"
                  />
                  <div class="enterprise-cell-stack">
                    <span
                      class="enterprise-cell-primary truncate-1"
                      [title]="d.name"
                      >{{ d.name }}</span
                    >
                    <span class="enterprise-cell-secondary font-mono"
                      >ID: {{ d.id }}</span
                    >
                  </div>
                </div>
              </td>
              <td class="text-xs text-muted-foreground max-w-40">
                <span class="truncate-1" [title]="d.specialty">{{
                  d.specialty
                }}</span>
              </td>
              <td class="text-xs text-muted-foreground max-w-44">
                <span class="truncate-1" [title]="d.clinicName">{{
                  d.clinicName
                }}</span>
              </td>
              <td class="text-xs text-muted-foreground max-w-44">
                <span class="truncate-1" [title]="d.email">{{ d.email }}</span>
              </td>
              <td
                class="text-xs font-mono text-muted-foreground whitespace-nowrap"
              >
                {{ d.phone }}
              </td>
              <td
                class="text-xs font-mono font-semibold text-center text-foreground"
              >
                {{ d.ordersCount }}
              </td>
              <td
                class="text-xs font-mono text-muted-foreground whitespace-nowrap"
              >
                {{ d.joinedDate }}
              </td>
              <td>
                <app-status-badge [status]="d.status" size="xs" />
              </td>
            </tr>
          </ng-template>
        </p-table>
      }
    </div>
  </div>

  <app-entity-dialog
    [visible]="showAddDialog()"
    (visibleChange)="showAddDialog.set($event)"
    (closed)="closeAddDialog()"
    title="Add Doctor"
    subtitle="Register a new referring dentist."
  >
    <div class="mt-4 space-y-3">
      <label class="block"
        ><span class="mb-1 block text-xs font-semibold">Full Name</span>
        <app-input
          id="doctor-new-name"
          [unstyled]="true"
          inputClass="w-full rounded-lg border border-border bg-card px-3 py-2 text-sm"
          placeholder="Dr. First Last"
          [value]="newName()"
          (valueChange)="newName.set($event)"
        ></app-input
      ></label>
      <label class="block"
        ><span class="mb-1 block text-xs font-semibold">Specialty</span>
        <app-select
          id="doctor-new-specialty"
          [unstyled]="true"
          selectClass="w-full cursor-pointer rounded-lg border border-border bg-card px-3 py-2 text-sm"
          [options]="[
            'General Dentistry',
            'Prosthodontics',
            'Oral Surgery',
            'Orthodontics',
            'Periodontics',
          ]"
          [value]="newSpecialty()"
          (valueChange)="newSpecialty.set($event)"
        ></app-select>
      </label>
      <label class="block"
        ><span class="mb-1 block text-xs font-semibold">Clinic</span>
        <app-input
          id="doctor-new-clinic"
          [unstyled]="true"
          inputClass="w-full rounded-lg border border-border bg-card px-3 py-2 text-sm"
          [value]="newClinic()"
          (valueChange)="newClinic.set($event)"
        ></app-input
      ></label>
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <label class="block"
          ><span class="mb-1 block text-xs font-semibold">Email</span>
          <app-input
            id="doctor-new-email"
            type="email"
            [unstyled]="true"
            inputClass="w-full rounded-lg border border-border bg-card px-3 py-2 text-sm"
            placeholder="doctor@clinic.com"
            [value]="newEmail()"
            (valueChange)="newEmail.set($event)"
          ></app-input
        ></label>
        <label class="block"
          ><span class="mb-1 block text-xs font-semibold">Phone</span>
          <app-input
            id="doctor-new-phone"
            [unstyled]="true"
            inputClass="w-full rounded-lg border border-border bg-card px-3 py-2 text-sm"
            placeholder="+1 (555) 000-0000"
            [value]="newPhone()"
            (valueChange)="newPhone.set($event)"
          ></app-input
        ></label>
      </div>
    </div>

    <div dialog-actions>
      <app-button variant="outline" size="sm" (onClick)="closeAddDialog()"
        >Cancel</app-button
      >
      <app-button variant="primary" size="sm" (onClick)="saveDoctor()"
        >Save Doctor</app-button
      >
    </div>
  </app-entity-dialog>
</div>
